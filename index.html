<div class="cola-pendientes-container">
  <h3>Cola de pendientes WhatsApp</h3>
  <div id="pending-list">Cargando pendientes...</div>
</div>

<script>
function cargarColaPendientes() {
  google.script.run
    .withSuccessHandler(renderizarCola)
    .getWhatsAppPending_();
}

function renderizarCola(items) {
  const container = document.getElementById('pending-list');
  if (!items || items.length === 0) {
    container.innerHTML = '<p>No hay gestiones pendientes en esta categoría.</p>';
    return;
  }

  let html = '';
  items.forEach(item => {
    const badgeColor = item.esClientePalm ? '#10b981' : '#f59e0b';
    const desarrolloTexto = item.esClientePalm ? 'PALM' : item.desarrollo;

    html += `
      <div class="card-pendiente" style="border: 1px solid #e2e8f0; padding: 12px; margin-bottom: 10px; border-radius: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <strong>${item.nombre} (${item.telefono})</strong>
          <span style="background:${badgeColor}; color:white; padding: 2px 8px; border-radius: 12px; font-size: 12px;">
            ${desarrolloTexto}
          </span>
        </div>
        <p style="margin: 6px 0; font-size: 13px;"><strong>Mensaje:</strong> ${item.mensaje}</p>
        <p style="margin: 4px 0; font-size: 12px; color: #4b5563;"><strong>Resumen IA:</strong> ${item.resumen}</p>
        <p style="margin: 4px 0; font-size: 12px; color: #2563eb;"><strong>Respuesta Sugerida:</strong> ${item.respuestaSugerida}</p>
        
        <div style="margin-top: 10px; display: flex; gap: 8px;">
          <button onclick="aprobarGestion('${item.id}', true, '${item.desarrollo}')" style="background:#10b981; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Aceptar</button>
          <button onclick="rechazarGestion('${item.id}')" style="background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Rechazar</button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function aprobarGestion(id, esPalm, desarrollo) {
  const datos = { esClientePalm: esPalm, desarrollo: desarrollo };
  google.script.run
    .withSuccessHandler(() => {
      alert('Contacto aprobado y enviado a expediente.');
      cargarColaPendientes();
    })
    .procesarPendienteWhatsApp(id, 'ACEPTAR', datos);
}

function rechazarGestion(id) {
  google.script.run
    .withSuccessHandler(() => {
      cargarColaPendientes();
    })
    .procesarPendienteWhatsApp(id, 'RECHAZAR', {});
}

// Cargar al iniciar
document.addEventListener('DOMContentLoaded', cargarColaPendientes);
</script>
